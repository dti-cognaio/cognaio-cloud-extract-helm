# ---------------------------------------------------------------------------
# cryptoprovider  (Azure Key Vault, not PostgreSQL)
# ---------------------------------------------------------------------------
# A different resource than the blocks above: this identity needs WRAP/UNWRAP on
# the platform main key in Key Vault, nothing else and no database. Give it its
# OWN identity - the point of the service is that no other pod can reach that key.
#
# The key URI itself lives in examples/values-crypto-azurekv.yaml together with
# the bearer token and the voucher key; this block only covers the identity.
cryptoprovider:
  env:
    kek:
      provider: "azurekv"
      # azureKeyvaultKeyUri: "https://<vault>.vault.azure.net/keys/<key-name>"

  # --- Option 1: Service Principal ---
  # Only outside Azure. Inside, prefer Option 2 - a client secret in a pod that
  # holds the main key is exactly the credential this design tries to remove.
  extraEnv:
    - name: AZURE_TENANT_ID
      value: "<your-tenant-id>"
    - name: AZURE_CLIENT_ID
      value: "<your-client-id>"
    - name: AZURE_CLIENT_SECRET
      value: "<your-client-secret>"

  # --- Option 2: Workload Identity (recommended - remove extraEnv above) ---
  # serviceAccount:
  #   create: true
  #   name: cryptoprovider
  #   annotations:
  #     azure.workload.identity/client-id: "<your-client-id>"
  #   automount: true
  # podLabels:
  #   azure.workload.identity/use: "true"
  #   app.kubernetes.io/component: cryptoprovider
  #   app.kubernetes.io/part-of: cce-core

cognaioservice:
  name: cognaioservice
  replicaCount: 1
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 100
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80
  podLabels:
    app.kubernetes.io/part-of: cce-core
  podSelectorLabels:
    app.kubernetes.io/component: cognaioservice
  serviceAccount:
    create: false
    annotations: {}
    name: "default"
    automount: false
  podSecurityContext: {}
  securityContext: {}
  # NOTE: the SchemaManager used to run here as `cognaioservice.init`. Since 3.1.0 it is a
  # standalone Job (see the `cognaioschemamanager` block) that must run AFTER the crypto
  # provider and BEFORE every database service.
  image:
    name: dti/idp/cognaioservice
    tag: "3.1.0"
  # OTel overrides (enabled / serviceName / endpoint / captureHeaders) for CognaioService (OTLP/HTTP); empty = global .Values.otel.
  otel: {}
    # enabled: true
    # serviceName: "cognaioservice"
    # endpoint: ""
    # captureHeaders: ""
  nodeSelector: {}
  tolerations: []
  affinity: {}
  # Spread the replicas of THIS component. The labelSelector has to name the component,
  # a chart-wide default would pull in every other pod of the release.
  # - maxSkew: 1
  #   topologyKey: kubernetes.io/hostname
  #   whenUnsatisfiable: ScheduleAnyway
  #   labelSelector:
  #     matchLabels:
  #       app.kubernetes.io/component: cognaioservice
  #   matchLabelKeys:
  #     - pod-template-hash
  topologySpreadConstraints: []
  service:
    name: cognaioservice
    port: 80
    type: ClusterIP
    urlpath: /extraction/api
  env:
    port: 3000
    # extra_ca_certs: /app/ca-certificates.crt
    secret:
      name: cognaioservice-env-secrets
      init: true
    db:
      dbCheckExistence: true
      postgreSqlUser: ""
      postgreSqlPwd: ""
      postgreSqlDbServer: ""
      postgreSqlDbPort: 5432
      postgreSqlSslRequired: true
      postgreSqlDbName: "cognaio_idp"
      schemas:
        - cognaio_extensions
        - cognaio_design
        - cognaio_audits
      postgreSqlAuthMode: "basic" # any other mode than entra would lead to standard username/password usage
    tokens:
      passPhraseAuditArtifacts: ""
      passPhraseDefinitions: ""
      passPhraseTemplates: ""
      passPhraseCryptoAsymetric: ""
      passPhraseCryptoSymetric: ""
      tokenEncryptionTokenJwtKey: ""
      passPhraseAccessTokenJwtKey: ""
      passPhraseRefreshTokenJwtKey: ""
      passPhraseUnsubscribeTokenJwtKey: ""
      passPhraseExportTokenJwtKey: ""
      passPhraseMailboxesTokenJwtKey: ""
      passPhraseEnvelopesTokenJwtKey: ""
      passPhraseRegisterTokenJwtKey: ""
      passPhraseOtpTokenJwtKey: ""
      passPhraseAppKeyJwtKey: ""
      passPhraseCryptoSymetricAppKey: ""
      passPhraseAnalyzeFromContentJwtKey: ""
      passPhraseAnalyzeResponseDownloadJwtKey: ""
    ai:
      apikeyAzureOpenAi: ""
      apikeyNativeOpenAi: ""
      apikeyAiFoundry: ""
      apikeyAzureAiDocumentIntelligence: ""
      apikeyAzureCognitiveServicesComputervision: ""
      endpointAzureOpenAi: ""
      endpointNativeOpenAi: ""
      endpointAiFoundry: ""
      endpointAzureAiDocumentIntelligence: ""
      endpointAzureCognitiveServicesComputerVision: ""
      apikeyNativeGemini: ""
      apikeyNativeAnthropic: ""
      apikeyNativeCerebral: ""
      endpointNativeCerebral: ""
    aws:
      accesskeyIdAwsTextract: ""
      secretAccessKeyAwsTextract: ""
      regionAwsTextract: ""
      accesskeyIdAwsBedrock: ""
      secretAccessKeyAwsBedrock: ""
      regionAwsBedrock: ""
    mailAccount:
      user: ""
      password: ""
      host: "smtp.office365.com"
      port: 587
      fromAddressFriendlyName: "Cognaio"
      useAdvancedAuth: false
      advancedAuth:
        auth:
          user: "yourEmailAddress"
          pass: "yourPassword"
      useCustomSettings: false
      customSettings:
        secure: false
        maxConnections: 150
        tls:
          ciphers: "SSLv3"
          rejectUnauthorized: false
      notificationProvider: "smtp" # any other provider than 'graph' would lead to standard SMTP usage
    organization:
      users:
        - "email_1@example.com"
        - "email_2@example.com"
    cognitiveServices:
      computervision:
        maxRequestTimeoutInSec: 6
        maxRetries: 30
        maxRetriesWaitTimeoutInSec: 1
        maxWaitTimeoutForFinishedInSec: 1
      aiDocumentIntelligence:
        maxRequestTimeoutInSec: 60
        maxRetries: 30
        maxRetriesWaitTimeoutInSec: 3
      awsTextract:
        maxRequestTimeoutInSec: 60
        maxRetries: 30
        maxRetriesWaitTimeoutInSec: 3
    openID:
      passPhraseUserInfo: ""
      passPhraseOidcSecrets: ""
      microsoftDisabled: true
      microsoftClientId: ""
      microsoftClientSecret: ""
      microsoftTenant: "common"
      microsoftTenantsExpected: ""
      microsoftLayoutOrder: 1
      googleDisabled: true
      googleClientId: ""
      googleClientSecret: ""
      googleTenantsExpected: ""
      googleLayoutOrder: 2
      githubDisabled: true
      githubClientId: ""
      githubClientSecret: ""
      githubTenantsExpected: ""
      githubLayoutOrder: 3
      oidcProviderTypesDisabled: ""
    # The Page Identity service. cognaioservice pushes the page fingerprints there and asks it
    # for the distinct-page reports, so it needs the address and the admin token. The token is
    # read straight from the pageidentityservice secret - one value, so the two sides cannot
    # drift apart - and the URL is the in-cluster service name: there is no nginx route for
    # this service, so the fallback baked into the image does not work here.
    pageIdentity:
      # Months of retention handed to a tenant when cognaioservice registers it. Empty = the
      # default of the image.
      initialRetentionMonths: ""
      # internal = the Page Identity service is part of this deployment (what this chart does).
      deploymentMode: "internal"
    essentials:
      warningNotificationTimeoutInHours: 48
      featureExceedsLimitsNotificationTimeoutInDays: 2
      endpointsPrivateKey: ""
      endpointsPublicKey: ""
    # Feature catalogue. Every entry maps 1:1 to a Cognaio_Feature_*_Disabled variable.
    #
    # Convention throughout: `true` means the capability is NOT offered on this deployment.
    # The flag decides whether a capability exists here at all; where a per-organization
    # entitlement also applies, that stays admin-set in the UI and the flag only opens the door.
    #
    # The defaults follow the image config, with four deliberate exceptions that this chart has
    # always offered and keeps offering: cerebralEdgeDisabled, llmTemplatesSyncDisabled,
    # endpointsManageDisabled and viewPlatformAuditsDisabled. Changing them would take
    # capabilities away from every existing deployment that relies on the chart default.
    feature:
      # Cerebral Edge. Offered here; `true` in the image config.
      cerebralEdgeDisabled: false
      # AWS services (Textract / Bedrock).
      awsServicesDisabled: true
      # The Vodafone AI Booster service account.
      vodafoneAiBoosterDisabled: true
      # Application key (app key) usage.
      appKeyUsageDisabled: false
      # Page retention.
      pageRetentionDisabled: false
      # Automatic synchronization of the LLM template store. Offered here; `true` in the image.
      llmTemplatesSyncDisabled: false
      # Endpoints management permissions. Offered here; `true` in the image config. Note that
      # service accounts and non-administration members are additionally excluded through
      # serviceAccountPermissionsToExclude below - this flag alone does not give them the
      # endpoint API.
      endpointsManageDisabled: false
      # The platform audit log admin feature (browse / export audit artifacts). Offered here;
      # `true` in the image config.
      viewPlatformAuditsDisabled: false
      # Distinct-page reporting on top of the Page Identity service. Deploying that service does
      # not switch the reporting on - this does.
      reportingPageIdentityDisabled: true
      # Billable data re-encryption on key rotation. The standard offering rotates the KEY, not
      # the data already stored under the old one; catching that data up is the add-on this
      # unlocks (entitlement per organization stays admin-set).
      dataReencryptionDisabled: true
      # Organization admins configuring the key for their OWN organization instead of every
      # change going through a platform operator. The flag alone opens nothing: it has to meet a
      # permission granted per organization, which makes it safe to switch on ahead of the first
      # customer who asks.
      orgCustodySelfServiceDisabled: true
      # Which custody tiers this deployment OFFERS. `local` (platform-managed) always works and
      # cannot be switched off.
      #   BYOK - the customer generates the key and imports it; we hold and use it from then on.
      #   HYOK - the key stays in the customer's own Azure KV / AWS KMS / GCP KMS; we call out
      #          per unwrap, and they can revoke our access unilaterally.
      # Two switches, so "BYOK yes, HYOK no" is expressible: bring your own key, but this
      # deployment keeps NO outgoing connection to customer vaults and no availability coupling
      # to them (the "no outbound traffic from the SaaS" compliance posture).
      # Both apply to NEW custody only - an organization already on a vault keeps working, since
      # narrowing the catalogue must never take running data offline.
      custodyByokDisabled: true
      custodyHyokDisabled: true
      # Gates ONLY the DISPLAY of the empty-page columns (Pages empty / Pages distinct empty) in
      # the audit-report UI and the CSV/MD exports. Detection and all reporting math still run;
      # this just hides the columns.
      reportingEmptyPagesDisabled: true
    # Login-screen toggles. Not capabilities, just what the sign-in views offer.
    ui:
      loginAnalysisShowAvailablePlatformDefaults: true
      loginMyCognaioShowAvailablePlatformDefaults: true
      loginAnalysisShowAppKey: true
    environmentNameForNotifications: "COGNAiO IDP"
    otpDisabled: false
    serviceAccountPermissionsToExclude: '{"teamMembers": ["all"], "appkey": ["all"], "audits": ["can_download_artifacts_sensitive_info"], "endpoints": ["all"], "adminRuntime": ["all"], "designer": ["can_manage_llm_templates", "can_sync_llm_templates"], "oidc": ["all"]}'
    nonAdministrationLayerPermissionsToExclude: '{"endpoints": ["all"], "adminRuntime": ["all"], "designer": ["can_manage_llm_templates", "can_sync_llm_templates"], "oidc": ["all"]}'
    logSeverity: "info"
  extraEnv: []
  # - name: MY_EXTRA_VAR
  #   value: "my-value"
  # - name: MY_SECRET_VAR
  #   valueFrom:
  #     secretKeyRef:
  #       name: my-secret
  #       key: my-key
  extraContainers: []
  # - name: authentication-proxy
  #   image: myregistry/auth-proxy:1.0.0
  #   ports:
  #     - containerPort: 8081
  #   env:
  #     - name: UPSTREAM
  #       value: "http://localhost:3000"
  livenessProbe:
    tcpSocket:
      port: 3000
    initialDelaySeconds: 15
    periodSeconds: 10
  readinessProbe:
    tcpSocket:
      port: 3000
    initialDelaySeconds: 15
    periodSeconds: 10
  lifecycle: {}
    # preStop:
    #   exec:
    #     command: ["/bin/sh", "-c", "sleep 10"]
  resources:
    limits:
      memory: "1Gi"
    requests:
      memory: "512Mi"
      cpu: "200m"
  additionalVolumeMounts: []
  #   - mountPath: /app
  #     name: extra-ca-cert
  additionalVolumes: []
  #   - name: extra-ca-cert
  #     emptyDir: {}


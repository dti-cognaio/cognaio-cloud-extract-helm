# ---------------------------------------------------------------------------------------------
# cognaio-crypto - the KEK custody service (encryption 3.1.0)
#
# Holds the main key (KEK) and does nothing else: it wraps and unwraps the data keys that
# cognaioservice, cognaioflexsearchservice and the SchemaManager send it. It sees no documents,
# no customer data, no database - only short key values and the request to lock or unlock them.
#
# The point is that nobody holds both halves: whoever reaches the database finds only encrypted
# data keys, worthless without the main key, and whoever holds the main key has no database
# access. That separation is the entire security gain, and it is not created in the code - it is
# created in the deployment. It only holds as long as the two really run apart.
#
# Never behind nginx or an ingress, and no published port: the callers reach it over the
# in-cluster service name. mTLS on this hop comes from the service mesh (Istio), which is why
# the URL the callers get stays http:// - the sidecar makes it mutual.
# ---------------------------------------------------------------------------------------------
cryptoprovider:
  name: cryptoprovider
  replicaCount: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 100
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80
  podLabels:
    app.kubernetes.io/component: cryptoprovider
    app.kubernetes.io/part-of: cce-core
  podSelectorLabels:
    app.kubernetes.io/component: cryptoprovider
  # Its own cloud identity, and only its own: vault access should hang off THIS service account
  # (Workload Identity on Azure, IRSA on AWS). Then no vault credential has to sit in a file or
  # a secret at all, and no other pod gets that permission.
  serviceAccount:
    create: false
    annotations: {}
      # azure.workload.identity/client-id: "00000000-0000-0000-0000-000000000000"
    name: "default"
    automount: false
  podSecurityContext: {}
  securityContext: {}
  image:
    name: dti/idp/cryptoprovider
    tag: "3.1.0"
  # No otel block on purpose - the crypto provider ships no OpenTelemetry SDK.
  nodeSelector: {}
  tolerations: []
  affinity: {}
  # Spread the replicas of THIS component. The labelSelector has to name the component,
  # a chart-wide default would pull in every other pod of the release.
  # - maxSkew: 1
  #   topologyKey: kubernetes.io/hostname
  #   whenUnsatisfiable: ScheduleAnyway
  #   labelSelector:
  #     matchLabels:
  #       app.kubernetes.io/component: cryptoprovider
  #   matchLabelKeys:
  #     - pod-template-hash
  topologySpreadConstraints: []
  service:
    name: cryptoprovider
    port: 80
    type: ClusterIP
  # Annotations on every crypto resource (Deployment, Service, Secret, NetworkPolicy,
  # ServiceAccount, HPA). Under ArgoCD this is where the sync wave goes that has to bring the
  # crypto provider up before the SchemaManager Job - see examples/values-argocd.yaml.
  annotations: {}
    # argocd.argoproj.io/sync-wave: "-2"
  # Only the three callers may open a socket to the crypto port. The NetworkPolicy answers who
  # may reach the service, the mesh answers who the service is talking to - complementary, so
  # keep both rather than one instead of the other.
  networkPolicy:
    enabled: true
    # Some CNIs filter kubelet health probes through NetworkPolicies, and a service mesh wants
    # its own telemetry path. Put those exceptions here.
    extraIngress: []
    # - from:
    #     - namespaceSelector:
    #         matchLabels:
    #           kubernetes.io/metadata.name: istio-system
  env:
    port: 3000
    nodeEnv: "production"
    # extra_ca_certs: /app/ca-certificates.crt
    secret:
      name: cryptoprovider-env-secrets
      init: true
    # Shared bearer secret with the three callers, min 16 characters. The floor, not the
    # ceiling: one static string that four workloads carry, so keep the NetworkPolicy and the
    # mesh around it.
    cryptoServiceToken: ""
    # Rotation ring - comma-separated tokens that STILL authenticate but are never handed out.
    # Rotating takes three rollouts: new value above and the old one here, roll the crypto
    # provider; roll the callers with the new value; roll the crypto provider again with this
    # emptied. In between both values are accepted, and the service says so on every start
    # (token rotation window OPEN), so a forgotten entry shows up in the log.
    cryptoServiceTokenPrevious: ""
    # TIER-0. Seals every organization key setting - the custody vouchers stored in the callers
    # database. Absent = per-organization custody is off.
    #
    # !! A LOST VOUCHER KEY CANNOT BE RECOVERED !!
    # The data of every organization with its own key is then permanently unreadable: no
    # recovery path, no back door, no support case. Back it up like the main key, and try the
    # restore once - a sentence in a runbook is not a backup. You can REPLACE it whenever you
    # like (two rollouts, see below), but replacing needs the old key to still be there; it
    # changes a key, it never recovers one.
    #
    # It belongs to THIS service and to nothing else. It must never appear in a secret that a
    # database-reading workload mounts.
    cryptoVoucherKeyB64: ""
    # Old voucher key(s), comma-separated, while the reseal sweep of the callers runs. Roll out
    # the new key carrying the old one here, wait for the rollout to finish, let the sweep run,
    # and only then empty this in a second rollout - during a rolling update old pods cannot
    # open anything the new key has sealed.
    cryptoVoucherKeyPreviousB64: ""
    # Where the main key comes from. Rotating it inside a vault needs no restart and no
    # configuration change at all; only the env fallback does.
    kek:
      # azurekv | awskms | gcpkms | keyfile | env
      provider: "azurekv"
      # azurekv - the intended choice for a new environment. Grant the key to the service
      # account above through Workload Identity; outside Azure pass AZURE_TENANT_ID /
      # AZURE_CLIENT_ID / AZURE_CLIENT_SECRET via extraEnv.
      # Old key versions stay ENABLED: on Azure a version may only be disabled once the log
      # reports zero remaining rows. Tidying up here makes data unreadable.
      azureKeyvaultKeyUri: ""
      # awskms - turn automatic rotation on and leave it alone; the name of the key never changes.
      awsKmsKeyArn: ""
      awsRegion: ""
      # gcpkms - rotation is automatic and old versions stay enabled forever.
      gcpKmsKeyName: ""
      # keyfile - a mounted secret file; wire the mount through additionalVolumes/-Mounts.
      keyfilePath: ""
      keyfilePrevious: ""
      # env - the WEAKEST custody: anyone who can read the container environment (kubectl
      # describe, /proc, a crash dump) has the main key. Because the chart runs
      # NODE_ENV=production the service REFUSES TO BOOT with it unless insecureCustodyAck is
      # also true. Only for a demo or drill stack that deliberately holds nothing worth
      # protecting.
      #
      # And here, when you change the key, change its NAME too: every encrypted row records the
      # kid that sealed it, so a new key under the old kid makes everything sealed with the old
      # one unreadable. The SchemaManager notices at the next start and stops the deploy - put
      # the old key back, then rotate properly with a new kid.
      materialB64: ""
      kid: ""
      # JSON list of outgoing keys, e.g. [{"kid":"env:v1","b64":"..."}]
      materialPrevious: ""
      insecureCustodyAck: false
      # App-binding pepper. The delivered key is not used raw: the effective key is
      # HKDF(rawKey, pepper). Unset means the service falls back to the DEV_PEPPER, a constant
      # that is public in the source - fine for a dev stack, worthless as hardening anywhere else.
      #
      # ⚠️ Setting this on an environment that ALREADY holds data breaks it. The kid records the
      # pepper VERSION (+p1), not its content, so a new pepper changes the effective key while the
      # kid stays the same - every existing row then fails to unwrap, with nothing in the kid to
      # explain why. Treat it like a key rotation: new `kid`, old material in `materialPrevious`.
      pepperB64: ""
      # Set to true in any real deployment: a missing pepperB64 then becomes a hard boot failure
      # instead of silently binding to the public dev constant.
      requireRealPepper: false
      # During a custody switch (azurekv -> awskms, say) LEAVE the lines of the old provider in
      # place: they are auto-detected as read side, so existing rows keep unwrapping while the
      # sweep re-wraps them under the new one. Delete them only once the log reports zero rows
      # on the old kid.
      #
      # The remaining knobs of the image are not templated - they have working defaults and
      # nobody tunes them from a chart. Reach them through extraEnv if you ever have to:
      # KEK_READ_PROVIDERS (explicit read-side override), Crypto_Vault_Key_Refresh_Ms.
  livenessProbe:
    tcpSocket:
      port: 3000
    initialDelaySeconds: 15
    periodSeconds: 10
  # /healthz says "the process is alive", /readyz runs a real wrap/unwrap against the configured
  # main key and therefore says "can actually do its job". The SchemaManager gate hangs on that
  # answer - it is how a wrong vault key or a missing permission surfaces at deploy time instead
  # of at three in the morning. Switch to tcpSocket only if the probe ever has to cross a mesh
  # policy that refuses the kubelet.
  readinessProbe:
    httpGet:
      path: /readyz
      port: 3000
    initialDelaySeconds: 10
    periodSeconds: 10
  lifecycle: {}
    # preStop:
    #   exec:
    #     command: ["/bin/sh", "-c", "sleep 10"]
  resources:
    limits:
      memory: "1Gi"
    requests:
      memory: "512Mi"
      cpu: "200m"
  additionalVolumeMounts: []
  #   - mountPath: /kek
  #     name: kek-keyfile
  additionalVolumes: []
  #   - name: kek-keyfile
  #     secret:
  #       secretName: crypto-kek-keyfile
  extraEnv: []
  # - name: AZURE_CLIENT_SECRET
  #   valueFrom:
  #     secretKeyRef:
  #       name: my-secret
  #       key: my-key
  extraContainers: []
  # - name: my-sidecar
  #   image: my-registry/my-sidecar:1.0.0

# ---------------------------------------------------------------------------------------------
# cognaioschemamanager - schemas, migrations and key maintenance (encryption 3.1.0)
#
# Up to 3.0.x this ran as cognaioservice.init. It is its own Job now, because the order it needs
# cannot be expressed from inside another pod:
#
#     cryptoprovider ready (/readyz green)  ->  this Job exits 0  ->  all remaining services
#
# It runs on EVERY rollout, not only when there are database changes: on each start it also
# walks every key row, checks whether it still opens under the currently configured main key,
# and moves the stale ones over. All of it in a single transaction - if one step fails the whole
# run is rolled back and the Job exits non-zero, so nothing else starts. There is no
# half-finished state, and a wrong main key or a missing vault permission surfaces at deploy
# time rather than when someone opens a record.
#
# Everything except the image, scheduling and the crypto wiring is read from
# cognaioservice.env.* and the cognaioservice secret - deliberately not duplicated here.
# ---------------------------------------------------------------------------------------------
cognaioschemamanager:
  name: cognaioschemamanager
  image:
    name: dti/idp/cognaioschemamanager
    tag: "3.1.0"
  # OTel overrides (enabled / serviceName / endpoint) for the SchemaManager (OTLP/gRPC); empty = global .Values.otel.
  otel: {}
    # enabled: true
    # serviceName: "cognaioschemamanager"
    # endpoint: ""
  podSecurityContext: {}
  securityContext: {}
  serviceAccount:
    create: false
    annotations: {}
    name: "default"
    automount: false
  # Annotations on the Job resource. This is where a GitOps tool takes over the recreation -
  # see jobNamePerRevision below and examples/values-argocd.yaml.
  annotations: {}
    # argocd.argoproj.io/hook: Sync
    # argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    # argocd.argoproj.io/sync-wave: "-1"
  # A finished Job is immutable, so something has to recreate it or the migration silently does
  # not run on the next rollout. With true (the default) the Job name carries the release
  # revision, which makes plain `helm upgrade` correct on its own: a new name is a new Job, and
  # Helm removes the one of the previous revision. The price is that the gate spec changes every
  # upgrade, so the four gated services roll along.
  #
  # Set to false ONLY when your delivery tool guarantees delete-before-create - an ArgoCD Sync
  # hook with `hook-delete-policy: BeforeHookCreation`, for example. Then the name is stable
  # (`kubectl logs job/cognaioschemamanager` without looking up a revision) and the gated
  # services stop rolling on every sync.
  #
  # ⚠️ With false and a plain `helm upgrade` the finished Job just stays: the gate reads
  # `succeeded` from the PREVIOUS release, waves the services through, and the migration never
  # ran. Nothing fails, nothing is logged - that is why true is the default.
  jobNamePerRevision: true
  # While the crypto provider is still coming up the SchemaManager fails loud and the Job
  # retries - that retry IS the crypto -> SchemaManager edge, so give it room. A genuinely
  # broken migration exhausts the limit and leaves the Job failed, which keeps the gate below
  # closed and stops the rollout instead of waving it through.
  backoffLimit: 30
  # Empty on purpose. The gate polls this Job by name, so the object has to outlive the rollout:
  # any pod that restarts later (node drain, OOM, eviction, a scale-up) polls it again, and a
  # TTL-collected Job answers 404 - the pod would then wait in Init forever instead of coming
  # back. Cleanup is not needed either way: Helm drops the Job of the previous revision on
  # upgrade, and an ArgoCD hook with BeforeHookCreation does the same.
  ttlSecondsAfterFinished: ""
  # Two waits, both built from the settings below.
  #
  # 1. The Job waits for the crypto provider (http://<cryptoprovider>/readyz) before the migrator
  #    starts. This one is ALWAYS rendered, independent of `enabled`. It has to be: the migrator
  #    pings the crypto provider at startup and throws when it is absent, but that exception
  #    escapes ExecuteAsync and the generic host ends the process with exit code 0 - the Job then
  #    counts as succeeded, never retries, and the migration silently never runs.
  #
  # 2. The database services wait for this Job, through an init container that polls the
  #    Kubernetes API with the service account token of its own pod. The chart renders the
  #    matching Role and RoleBinding (get on batch/jobs). `enabled: false` drops this one and its
  #    RBAC - the services then fail loud and CrashLoopBackOff until the migration is through,
  #    which Kubernetes heals on its own.
  gate:
    enabled: true
    # Any image with a busybox wget. Defaults to the nginx image the chart already pulls.
    image:
      name: nginx/nginx
      tag: 1.31.6-alpine-slim
    pollSeconds: 5
    resources:
      limits:
        memory: "64Mi"
      requests:
        memory: "32Mi"
        cpu: "10m"
  nodeSelector: {}
  tolerations: []
  affinity: {}
  resources:
    limits:
      memory: "512Mi"
    requests:
      memory: "256Mi"
      cpu: "100m"
  additionalVolumeMounts: []
  #   - mountPath: /app/tmp
  #     name: cache-volume
  additionalVolumes: []
  #   - name: cache-volume
  #     emptyDir: {}
  extraEnv: []
  # - name: MY_EXTRA_VAR
  #   value: "my-value"

  #   type: RuntimeDefault
  # runAsNonRoot: true
  # runAsUser: 1000

securityContext: {}
  # allowPrivilegeEscalation: false
  # readOnlyRootFilesystem: true
  # capabilities:
  #   drop: ["ALL"]

annotations: {}
labels: {}

image:
  pullPolicy: Always
  containerRegistry: "dtideregistry.azurecr.io"
  restartPolicy: "Always"

# OpenTelemetry (global, applies to all instrumented services)
otel:
  enabled: false
  endpoint: ""
  endpointGrpc: ""
  propagators: "tracecontext,baggage,b3"
  captureHeaders: "x-tenant"
  resourceAttributes: {}
  extraEnv: []
  # - name: OTEL_TRACES_SAMPLER
  #   value: "parentbased_traceidratio"
  # - name: OTEL_TRACES_SAMPLER_ARG
  #   value: "0.1"
  # - name: OTEL_LOG_LEVEL          # SDK self diagnostics, troubleshooting only
  #   value: "debug"

# COGNAiO specific values
cognaio:
  namespace: cognaio-idp
  url: ""
  protocol: "https"
  wildcardUrl: ""
  cert:
    certificate: ""
    key: "" 
    secret:
      name: cognaio-com-tls-secret
      init: true
  ingress:
    enabled: true


apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.cognaioservice.name }}
  labels:
    {{- include "cognaio.labels" . | nindent 4 }}
    {{- with .Values.cognaioservice.podLabels }}
      {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- if not .Values.cognaioservice.autoscaling.enabled }}
  replicas: {{ .Values.cognaioservice.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "cognaio.selectorLabels" . | nindent 6 }}
      {{- with .Values.cognaioservice.podSelectorLabels }}
        {{- toYaml . | nindent 6 }}
      {{- end }}
  template:
    metadata:
      {{- with (merge (.Values.cognaioservice.podAnnotations | default dict) (.Values.podAnnotations | default dict)) }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "cognaio.labels" . | nindent 8 }}
        {{- with (merge (.Values.cognaioservice.podLabels | default dict) (.Values.podLabels | default dict)) }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.cognaioservice.podSelectorLabels }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ .Values.cognaioservice.serviceAccount.name }}
      {{- with (default .Values.podSecurityContext .Values.cognaioservice.podSecurityContext) }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      restartPolicy: {{ default .Values.image.restartPolicy .Values.cognaioservice.restartPolicy | default "Always" }}
# The SchemaManager runs as its own Job now (crypto provider -> Job -> this service). Wait for
# it, so this container never reaches a half-migrated database. See _helpers.tpl.
      {{- include "cognaio.schemaManagerGate" $ | nindent 6 }}
# Main Container
      containers:
        - name: {{ .Values.cognaioservice.name }}
          image: {{ .Values.image.containerRegistry }}/{{ .Values.cognaioservice.image.name }}:{{ .Values.cognaioservice.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with (default .Values.securityContext .Values.cognaioservice.securityContext ) }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
          - name: http
            containerPort: {{ .Values.cognaioservice.env.port }}
            protocol: TCP
          {{- with (default .Values.livenessProbe .Values.cognaioservice.livenessProbe) }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with (default .Values.readinessProbe .Values.cognaioservice.readinessProbe) }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
          - name: PORT
            value: {{ .Values.cognaioservice.env.port | quote }}
          - name: NODE_ENV
            value: 'production'
          {{- if .Values.cognaioservice.env.extra_ca_certs }}
          - name: NODE_EXTRA_CA_CERTS
            value: {{ .Values.cognaioservice.env.extra_ca_certs }}
          {{- end }}
          - name: BaseWebAppLink
            value: {{ .Values.cognaio.protocol }}://{{ .Values.cognaio.url }}{{ .Values.cognaioinsightagentic.service.urlpath }}
          - name: BaseCognaioServiceUrl
            value: {{ .Values.cognaio.protocol }}://{{ .Values.cognaio.url }}{{ .Values.cognaioservice.service.urlpath }}
          - name: BaseUrl_FlexSearchProvider
            value: http://{{ .Values.cognaioflexsearchservice.service.name }}
          - name: BaseUrl_ImageProvider
            value: http://{{ .Values.imageprovider.service.name }}
          - name: BaseUrl_EmailProvider
            value: http://{{ .Values.emailservice.service.name }}
          - name: BaseUrl_ObjectDetectionProvider
            value: http://{{ .Values.objectdetectionprovider.service.name }}
          - name: BaseUrl_AuditCleanupProvider
            value: http://{{ .Values.cognaioauditscleanup.service.name }}
          - name: BaseUrl_UserManual
            value: http://{{ .Values.usermanual.service.name }}
  # Page Identity. The image falls back to an nginx route that this chart does not render, so
  # the address has to be set explicitly: the service is reachable in-cluster only. The admin
  # token comes from the pageidentityservice secret rather than a second copy here - it
  # authorizes the /admin/tenants/* calls cognaioservice makes at startup, and while it is
  # empty every one of them fails closed with 503.
          - name: BaseCognaioPageIdentityServiceUrl
            value: http://{{ .Values.pageidentityservice.service.name }}
          - name: Cognaio_PageIdentity_Admin_Token
            valueFrom:
              secretKeyRef:
                name: {{ .Values.pageidentityservice.env.secret.name }}
                key: pageIdentityAdminToken
          {{- with .Values.cognaioservice.env.pageIdentity.initialRetentionMonths }}
          - name: Cognaio_PageIdentity_Initial_Retention_Months
            value: {{ . | quote }}
          {{- end }}
          - name: Cognaio_PageIdentity_Deployment_Mode
            value: {{ .Values.cognaioservice.env.pageIdentity.deploymentMode | quote }}
          - name: RedisProviderUrl
            valueFrom:
              secretKeyRef:
                name: {{ .Values.redis.secret.name }}
                key: providerUrl
  # Remote KEK custody - the crypto provider (mandatory since 3.1.0). This process holds NO key
  # material and no vault credentials: it sends 32-byte data keys to be wrapped and wrapped blobs
  # to be unwrapped, and payloads never cross. An unreachable service is a hard boot failure.
  # The URL stays http:// - mTLS on this hop comes from the service mesh.
          - name: Crypto_Service_Url
            value: http://{{ .Values.cryptoprovider.service.name }}
          - name: Crypto_Service_Token
            valueFrom:
              secretKeyRef:
                name: {{ .Values.cryptoprovider.env.secret.name }}
                key: cryptoServiceToken
  # DB
          - name: PostgreSql_User
            valueFrom:
              secretKeyRef:
                name: {{ .Values.cognaioservice.env.secret.name }}
                key: postgreSqlUser
          - name: PostgreSql_Pwd
            valueFrom:
              secretKeyRef:
                name: {{ .Values.cognaioservice.env.secret.name }}
                key: postgreSqlPwd
          - name: PostgreSql_Db_Server
            value: {{ .Values.cognaioservice.env.db.postgreSqlDbServer }}:{{ .Values.cognaioservice.env.db.postgreSqlDbPort }}
          - name: PostgreSql_Ssl_Required
            value: {{ .Values.cognaioservice.env.db.postgreSqlSslRequired | quote }}
          - name: PostgreSql_Db_Name
            value: {{ .Values.cognaioservice.env.db.postgreSqlDbName | quote }} 
          - name: PostgreSql_Schemas
            value: {{ include "cognaio.dbSchemas" .Values.cognaioservice.env.db.schemas }}
  # Auth Mode
          - name: PostgreSql_Auth_Mode
            value: {{ .Values.cognaioservice.env.db.postgreSqlAuthMode | quote }}
  # Notification
          - name: Notification_Provider
            value: {{ .Values.cognaioservice.env.mailAccount.notificationProvider | quote }}
  # No PassPhrase_* here any more. Every former value was seeded once into the key table by the
  # SchemaManager and is fetched from there at runtime through the crypto provider - this pod
  # holds no key material at all. Careful when cleaning up values: Token_*_ExpiresInMinutes are
  # lifetimes, not keys, and they stay.
  # Mailbox Account
          - name: MailAccount_Host
            value: {{ .Values.cognaioservice.env.mailAccount.host | quote }} 
          - name: MailAccount_Port
            value: {{ .Values.cognaioservice.env.mailAccount.port | quote }}
          - name: MailAccount_User
            valueFrom:
              secretKeyRef:
                name: {{ .Values.cognaioservice.env.secret.name }}
                key: mailAccountUser
          - name: MailAccount_Pwd
            valueFrom:
              secretKeyRef:
                name: {{ .Values.cognaioservice.env.secret.name }}
                key: mailAccountPassword
          - name: MailAccount_FromAddressFriendlyName
            value: {{ .Values.cognaioservice.env.mailAccount.fromAddressFriendlyName | quote }}
          - name: MailAccount_UseAdvancedAuth
            value: {{ .Values.cognaioservice.env.mailAccount.useAdvancedAuth | quote }}
          - name: MailAccount_AdvancedAuthJson
            value: {{ .Values.cognaioservice.env.mailAccount.advancedAuth | toJson | quote }}
          - name: MailAccount_UseCustomSettings
            value: {{ .Values.cognaioservice.env.mailAccount.useCustomSettings | quote }}
          - name: MailAccount_CustomSettingsJson
            value: {{ .Values.cognaioservice.env.mailAccount.customSettings | toJson | quote }}
  # Cognitive Services
          - name: AzureCognitiveServicesComputerVision_MaxRequestTimeoutInSec
            value: {{ .Values.cognaioservice.env.cognitiveServices.computervision.maxRequestTimeoutInSec | quote }} 
          - name: AzureCognitiveServicesComputerVision_MaxRetries
            value: {{ .Values.cognaioservice.env.cognitiveServices.computervision.maxRetries | quote }}
          - name: AzureCognitiveServicesComputerVision_MaxRetriesWaitTimeoutInSec
            value: {{ .Values.cognaioservice.env.cognitiveServices.computervision.maxRetriesWaitTimeoutInSec | quote }}
          - name: AzureCognitiveServicesComputerVision_MaxWaitTimeoutForFinishedInSec
            value: {{ .Values.cognaioservice.env.cognitiveServices.computervision.maxWaitTimeoutForFinishedInSec | quote }}
  # Document Intelligence
          - name: AzureAiDocumentIntelligence_MaxRequestTimeoutInSec
            value: {{ .Values.cognaioservice.env.cognitiveServices.aiDocumentIntelligence.maxRequestTimeoutInSec | quote }}
          - name: AzureAiDocumentIntelligence_MaxRetries
            value: {{ .Values.cognaioservice.env.cognitiveServices.aiDocumentIntelligence.maxRetries | quote }}
          - name: AzureAiDocumentIntelligence_MaxRetriesWaitTimeoutInSec
            value: {{ .Values.cognaioservice.env.cognitiveServices.aiDocumentIntelligence.maxRetriesWaitTimeoutInSec | quote }}
  # AWS Textract
          - name: AwsTextract_MaxRequestTimeoutInSec
            value: {{ .Values.cognaioservice.env.cognitiveServices.awsTextract.maxRequestTimeoutInSec | quote }}
          - name: AwsTextract_MaxRetries
            value: {{ .Values.cognaioservice.env.cognitiveServices.awsTextract.maxRetries | quote }}
          - name: AwsTextract_MaxRetriesWaitTimeoutInSec
            value: {{ .Values.cognaioservice.env.cognitiveServices.awsTextract.maxRetriesWaitTimeoutInSec | quote }}
  # Essentials
          - name: Essential_Warning_Notification_TimeoutInHours
            value: {{ .Values.cognaioservice.env.essentials.warningNotificationTimeoutInHours | quote }}
          - name: Essential_FeatureExceedsLimits_Notification_TimeoutInDays
            value: {{ .Values.cognaioservice.env.essentials.featureExceedsLimitsNotificationTimeoutInDays | quote }}
          - name: Cognaio_Otp_Disabled
            value: {{ .Values.cognaioservice.env.otpDisabled | quote }}
  # Other
          - name: LogSeverity
            value: {{ .Values.cognaioservice.env.logSeverity }}
          - name: EnvironmentNameForNotifications
            value: {{ .Values.cognaioservice.env.environmentNameForNotifications }}
          - name: Endpoints_PrivateKey
            valueFrom:
              secretKeyRef:
                name: {{ .Values.cognaioservice.env.secret.name }}
                key: endpointsPrivateKey
          - name: Endpoints_PublicKey
            value: {{ .Values.cognaioservice.env.essentials.endpointsPublicKey | quote }}
  # Additional Features. true = the capability is not offered on this deployment.
          - name: Cognaio_Feature_Cerebral_Edge_Disabled
            value: {{ .Values.cognaioservice.env.feature.cerebralEdgeDisabled | quote }}
          - name: Cognaio_Feature_Aws_Services_Disabled
            value: {{ .Values.cognaioservice.env.feature.awsServicesDisabled | quote }}
          - name: Cognaio_Feature_Vodafone_Ai_Booster_Disabled
            value: {{ .Values.cognaioservice.env.feature.vodafoneAiBoosterDisabled | quote }}
          - name: Cognaio_Feature_AppKeyUsage_Disabled
            value: {{ .Values.cognaioservice.env.feature.appKeyUsageDisabled | quote }}
          - name: Cognaio_Feature_Page_Retention_Disabled
            value: {{ .Values.cognaioservice.env.feature.pageRetentionDisabled | quote }}
          - name: Cognaio_Feature_LlmTemplates_Sync_Disabled
            value: {{ .Values.cognaioservice.env.feature.llmTemplatesSyncDisabled | quote }}
          - name: Cognaio_Feature_Endpoints_Manage_Disabled
            value: {{ .Values.cognaioservice.env.feature.endpointsManageDisabled | quote }}
          - name: Cognaio_Feature_View_Platform_Audits_Disabled
            value: {{ .Values.cognaioservice.env.feature.viewPlatformAuditsDisabled | quote }}
          - name: Cognaio_Feature_Reporting_PageIdentity_Disabled
            value: {{ .Values.cognaioservice.env.feature.reportingPageIdentityDisabled | quote }}
          - name: Cognaio_Feature_Data_Reencryption_Disabled
            value: {{ .Values.cognaioservice.env.feature.dataReencryptionDisabled | quote }}
          - name: Cognaio_Feature_Org_Custody_SelfService_Disabled
            value: {{ .Values.cognaioservice.env.feature.orgCustodySelfServiceDisabled | quote }}
          - name: Cognaio_Feature_Custody_BYOK_Disabled
            value: {{ .Values.cognaioservice.env.feature.custodyByokDisabled | quote }}
          - name: Cognaio_Feature_Custody_HYOK_Disabled
            value: {{ .Values.cognaioservice.env.feature.custodyHyokDisabled | quote }}
          - name: Cognaio_Feature_Reporting_Empty_Pages_Disabled
            value: {{ .Values.cognaioservice.env.feature.reportingEmptyPagesDisabled | quote }}
  # Login-screen toggles
          - name: Cognaio_UI_Login_Analysis_Show_Available_Platform_Defaults
            value: {{ .Values.cognaioservice.env.ui.loginAnalysisShowAvailablePlatformDefaults | quote }}
          - name: Cognaio_UI_Login_My_Cognaio_Show_Available_Platform_Defaults
            value: {{ .Values.cognaioservice.env.ui.loginMyCognaioShowAvailablePlatformDefaults | quote }}
          - name: Cognaio_UI_Login_Analysis_Show_AppKey
            value: {{ .Values.cognaioservice.env.ui.loginAnalysisShowAppKey | quote }}
          - name: Oidc_ProviderTypes_Disabled
            value: {{ .Values.cognaioservice.env.openID.oidcProviderTypesDisabled | quote }}
          - name: ServiceAccount_Permissions_To_Exclude
            value: {{ .Values.cognaioservice.env.serviceAccountPermissionsToExclude | quote }}
          - name: NonAdministrationLayer_Permissions_To_Exclude
            value: {{ .Values.cognaioservice.env.nonAdministrationLayerPermissionsToExclude | quote }}
          {{- with (include "cognaio.otelEnv" (dict "root" $ "svc" .Values.cognaioservice "serviceName" "cognaioservice")) }}
  # OpenTelemetry (global: .Values.otel, overrides: cognaioservice.otel)
          {{- . | nindent 10 }}
          {{- end }}
          {{- with .Values.cognaioservice.extraEnv }}
          {{- toYaml . | nindent 10 }}
          {{- end }}
          {{- with .Values.cognaioservice.lifecycle }}
          lifecycle:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.cognaioservice.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
          {{- with .Values.cognaioservice.additionalVolumeMounts }}
            {{- toYaml . | nindent 12 }}
          {{- end}}
      {{- with .Values.cognaioservice.extraContainers }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
      {{- with .Values.cognaioservice.additionalVolumes }}
        {{- toYaml . | nindent 8 }}
      {{- end}}
      {{- with .Values.cognaioservice.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.cognaioservice.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.cognaioservice.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.cognaioservice.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}

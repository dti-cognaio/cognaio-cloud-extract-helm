{{- if .Values.cryptoprovider.env.secret.init -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.cryptoprovider.env.secret.name }}
  {{- with .Values.cryptoprovider.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
data:
  # The bearer token is referenced by all four workloads (this service plus cognaioservice,
  # cognaioflexsearchservice and the SchemaManager Job) - one secret, so the value cannot drift.
  cryptoServiceToken: {{ .Values.cryptoprovider.env.cryptoServiceToken | b64enc | quote }}
  cryptoServiceTokenPrevious: {{ .Values.cryptoprovider.env.cryptoServiceTokenPrevious | b64enc | quote }}
  # TIER-0: lose this and the data of every organization with its own key is unreadable for
  # good. Only this pod mounts it - never a database-reading workload.
  cryptoVoucherKeyB64: {{ .Values.cryptoprovider.env.cryptoVoucherKeyB64 | b64enc | quote }}
  cryptoVoucherKeyPreviousB64: {{ .Values.cryptoprovider.env.cryptoVoucherKeyPreviousB64 | b64enc | quote }}
  # Only used by the env / keyfile custody fallbacks - with a vault the main key never gets here.
  kekMaterialB64: {{ .Values.cryptoprovider.env.kek.materialB64 | b64enc | quote }}
  kekMaterialPrevious: {{ .Values.cryptoprovider.env.kek.materialPrevious | b64enc | quote }}
  kekPepperB64: {{ .Values.cryptoprovider.env.kek.pepperB64 | b64enc | quote }}
{{- end }}

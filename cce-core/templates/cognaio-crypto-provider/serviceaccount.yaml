{{- if .Values.cryptoprovider.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.cryptoprovider.serviceAccount.name }}
  labels:
    {{- include "cognaio.labels" . | nindent 4 }}
  {{- with (merge (.Values.cryptoprovider.serviceAccount.annotations | default dict) (.Values.cryptoprovider.annotations | default dict)) }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.cryptoprovider.serviceAccount.automount }}
{{- end }}
